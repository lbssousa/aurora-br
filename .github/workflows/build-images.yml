name: Build All Images
on:
    workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
    build-image-stable:
        uses: ./.github/workflows/build-image-stable.yml
        secrets: inherit
        permissions:
          contents: write
          packages: write
          id-token: write
    build-image-testing:
        uses: ./.github/workflows/build-image-testing.yml
        secrets: inherit
        permissions:
          contents: write
          packages: write
          id-token: write
    build-image-next:
        uses: ./.github/workflows/build-image-next.yml
        secrets: inherit
        permissions:
          contents: write
          packages: write
          id-token: write
